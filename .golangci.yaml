version: "2"

run:
  relative-path-mode: wd

linters:
  enable:
    - asciicheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - gocritic
    - godot
    - goheader
    - gomodguard_v2
    - gosec
    - govet
    - intrange
    - lll
    - loggercheck
    - nilnil
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - protogetter
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testifylint
    - unconvert
    - unparam
    - unused
    - varnamelen
    - whitespace
    - wrapcheck

  settings:
    godot:
      capital: true
      period: true
    lll:
      line-length: 120
      tab-width: 2
    goheader:
      values:
        regexp:
          YEAR: 20\d\d
      template: |-
        SPDX-FileCopyrightText: Copyright {YEAR} The Things Industries B.V.
        SPDX-License-Identifier: Apache-2.0
    gosec:
      excludes:
        - G115 # Potential integer overflow when converting between integer types
        - G404 # Insecure random number source (rand)
    exhaustive:
      default-signifies-exhaustive: true
    varnamelen:
      ignore-names:
        - a
        - b
        - db
        - i
        - j
        - k
        - ok
        - t
        - tc
        - st
        - to
        - tt
        - tx
        - v
      ignore-decls:
        - w http.ResponseWriter
        - r *http.Request
    wrapcheck:
      extra-ignore-sigs:
        - "func (context.Context).Err() error"
        # gRPC status errors are the terminal error form of a gRPC handler.
        - "google.golang.org/grpc/status.Error("
        - "github.com/packetbroker/packetbroker/pkg/host/status.Error("
        - "github.com/packetbroker/packetbroker/pkg/host/status.WrapError("
        - "github.com/packetbroker/packetbroker/pkg/host/status.WrapErrorf("
        # The auth helpers return gRPC status errors that handlers pass through unchanged.
        - "github.com/packetbroker/packetbroker/pkg/host/basicauth.Require"
        - "github.com/packetbroker/packetbroker/pkg/host/clusterauth.Require"
        - "github.com/packetbroker/packetbroker/pkg/host/networkauth.Require"
    revive:
      # The default rule set of revive, with dot imports allowed for goconvey.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
          arguments:
            - allowed-packages:
                - github.com/smartystreets/goconvey/convey
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    govet:
      disable:
        - stdversion
