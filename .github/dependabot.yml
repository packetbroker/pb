version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns:
          - "*"
    ignore:
      # Packet Broker modules are required by commit and bumped by hand in dependency order.
      - dependency-name: "go.packetbroker.org/*"
