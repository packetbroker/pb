name: Code Quality

on:
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/code-quality.yaml"
      - ".golangci.yaml"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get dependencies
        run: go mod download
      - name: Check code quality
        run: make quality
      - name: Format code
        run: make fmt
      - name: Tidy modules
        run: make deps.tidy
      - name: Check no diff
        run: make git.nodiff

  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get dependencies
        run: go mod download
      - name: Test coverage and races
        run: make test.race
